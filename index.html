<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmonia</title>
<!-- Landing page for the plain web address, so it doesn't show a 404. Links to each screen's demo. -->
<link rel="stylesheet" href="theme.css">
<style>
  .menu { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .crest { font-size: 64px; }
  #club { font-size: 64px; display: inline-block; letter-spacing: 8px; }
  .subtitle { font-size: 26px; }
  .links { display: flex; gap: 16px; margin-top: 14px; }
  .note { margin-top: 8px; font-size: 19px; font-style: italic; color: var(--ink); text-shadow: 0 1px 6px var(--plum); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="menu">
    <div class="crest"><span id="ll"></span><div class="title" id="club"></div><span id="lr"></span></div>
    <div class="subtitle">Your screens are online</div>
    <div class="links"><a class="cta" href="board.html">Leaderboard</a><a class="hud-btn" href="dancer.html">Dancer Control</a></div>
    <div class="note">Each one plays a demo. Use this page's address as WEB_URL.</div>
  </div>
</div>
<script src="club.js"></script>
<script>
  fit($('stage'));
  scenery($('stage'));
  $('ll').innerHTML = LAUREL(false);
  $('lr').innerHTML = LAUREL(true);
  fitText($('club'), CLUB_DEFAULT, 700, 64);
</script>
</body>
