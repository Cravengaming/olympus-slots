<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control</title>
<!-- Dancer controller screen. The controller script drives it through the address after "#":
     s=live|paused, t=club name, pl=current tipper, q=spins waiting, gr/gg/gt=tip goal raised, goal, promise, mx=max level, n=sequence,
     r=last reels "a,b,c", o=outcome, l=label, lv=level or preset name, sec=reward seconds, at=reward start (unix).
     With no "#", it plays a demo. Look and symbols come from theme.css and club.js. -->
<!-- ?r=<stamp> goes on the shared files too, so a Refresh gets their newest copies -->
<script>document.write(`<link rel="stylesheet" href="theme.css${location.search}">`);</script>
<style>
  header { position: absolute; left: 34px; right: 34px; top: 16px; height: 66px; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
  #crest { position: absolute; left: 50%; top: 0; width: 460px; margin-left: -230px; text-align: center; }
  #club { font-size: 32px; display: inline-block; line-height: 1.1; }
  #crest .crest { font-size: 32px; height: 40px; }
  #crest .subtitle { font-size: 18px; line-height: 1.05; }
  #status { gap: 8px; font-family: var(--title-font); font-weight: 700; font-size: 15px; letter-spacing: 2px; align-items: center; padding: 6px 14px; }
  #status.live { color: #8dffc9; border-color: #4dff9a88; box-shadow: 0 0 12px #4dff9a44; }
  #status.paused { color: #ff8fa6; border-color: #ff4d6d88; box-shadow: 0 0 12px #ff4d6d44; }
  #status i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .card { position: absolute; z-index: 2; padding: 11px 18px; }
  .card .heading { margin-bottom: 6px; }
  #player { left: 34px; top: 90px; width: 470px; height: 168px; text-align: center; }
  #pname { font-weight: 700; font-size: 36px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pname.none { color: var(--dim); font-style: italic; font-size: 28px; }
  #pturn { font-size: 19px; font-style: italic; color: var(--blush); }
  #pgoal { margin-top: 5px; font-weight: 700; font-size: 17px; color: var(--gold-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pbar { margin-top: 3px; height: 8px; border-radius: 4px; background: #ffffff18; overflow: hidden; display: none; }
  #pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--neon-pink), var(--gold-light)); transition: width .8s; }
  #last { left: 34px; top: 266px; width: 470px; height: 220px; text-align: center; }
  .mini { display: flex; justify-content: center; gap: 12px; margin: 6px 0 10px; }
  .mini div { width: 92px; height: 105px; font-size: 105px; }
  .mini div.blank { border-radius: 10px; box-shadow: 0 0 0 2px var(--gold); }
  #llabel { font-family: var(--title-font); font-weight: 700; font-size: 18px; color: var(--gold-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 8px #d9b57388; }

  #toy { left: 520px; right: 34px; top: 90px; height: 396px; text-align: center; }
  #meter { display: flex; gap: 5px; align-items: flex-end; height: 196px; margin: 12px 0 12px; }
  #meter div { flex: 1; border-radius: 5px 5px 2px 2px; background: #ffffff12; transition: background .3s, box-shadow .3s; }
  #meter div.on { background: linear-gradient(180deg, var(--neon-cyan), var(--neon-violet) 50%, var(--neon-pink)); box-shadow: 0 0 12px #ff2ee688; animation: throb .14s infinite alternate; }
  #meter div.capped { background: #ffffff05; outline: 1px dashed #ffffff22; }
  @keyframes throb { to { transform: translateY(-3px); } }
  #toynow { font-family: var(--title-font); font-weight: 700; font-size: 25px; line-height: 1.2; color: var(--gold-light); text-shadow: 0 0 10px #d9b57388; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toynow.idle { color: var(--dim); text-shadow: none; }
  #timebar { margin-top: 8px; height: 10px; border-radius: 5px; background: #ffffff14; overflow: hidden; }
  #timefill { height: 100%; width: 0; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); box-shadow: 0 0 10px var(--neon-pink); }
  #timetxt { height: 22px; margin-top: 4px; font-size: 17px; font-style: italic; color: var(--dim); }
  footer { margin-top: 2px; font-size: 16px; font-style: italic; color: var(--dim); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header><div class="plaque" id="toymax"></div><div id="crest"><div class="crest"><span id="ll"></span><div class="title" id="club"></div><span id="lr"></span></div><div class="subtitle">Dancer Control</div></div><div class="plaque live" id="status"><i></i><span>LIVE</span></div></header>
  <div class="temple card" id="player"><h2 class="heading">Now Spinning</h2><div id="pname"></div><div id="pturn"></div><div id="pgoal"></div><div id="pbar"><i></i></div></div>
  <div class="temple card" id="last"><h2 class="heading">Last Spin</h2><div class="mini" id="lreels"></div><div id="llabel"></div></div>
  <div class="temple card" id="toy"><h2 class="heading">Your Toy</h2><div id="meter"></div>
    <div id="toynow"></div>
    <div id="timebar"><div id="timefill"></div></div><div id="timetxt"></div>
    <footer>Click the HUD for the menu · STOP is always in the menu</footer></div>
</div>
<script>document.write(`<script src="club.js${location.search}"><\/script>`);</script>
<script>
const PRESETS = { pulse: 'Pulse pattern', wave: 'Wave pattern', fireworks: 'Fireworks pattern', earthquake: 'Earthquake pattern' };
const stage = $('stage');
let st = null, demoTimer = null, presetAnim = 0;

fit(stage);
scenery(stage, [495, 100]);
$('ll').innerHTML = LAUREL(false);
$('lr').innerHTML = LAUREL(true);
for (let i = 0; i < 20; i++) $('meter').appendChild(document.createElement('div'));
const bars = [...$('meter').children];
bars.forEach((b, i) => b.style.height = (30 + i * 3.5) + '%');

function render() {
  if (!st) return;
  const live = st.s !== 'paused';
  fitText($('club'), st.t || CLUB_DEFAULT, 340, 32);
  $('status').className = 'plaque ' + (live ? 'live' : 'paused');
  $('status').querySelector('span').textContent = live ? 'LIVE' : 'PAUSED';
  $('pname').textContent = st.pl || 'No spins yet';
  $('pname').className = st.pl ? '' : 'none';
  $('lreels').innerHTML = st.r.length === 3 ? st.r.map(r => `<div>${sym(r)}</div>`).join('')
                                            : '<div class="marble blank"></div><div class="marble blank"></div><div class="marble blank"></div>';
  $('llabel').textContent = st.l || 'Waiting for the first spin';
  $('pgoal').textContent = st.gg > 0 ? `Goal: L$${st.gr} / L$${st.gg}${st.gt ? ' · ' + st.gt : ''}` : 'Menu → Tip Goal to set a goal';
  $('pbar').style.display = st.gg > 0 ? 'block' : 'none';
  $('pbar').firstChild.style.width = st.gg > 0 ? Math.min(100, st.gr / st.gg * 100) + '%' : '0';
  $('toymax').innerHTML = `Max <b>${st.mx}</b>/20`;
  bars.forEach((b, i) => b.classList.toggle('capped', i >= st.mx));
  tick();
}

// runs ten times a second: the toy meter follows the rhythm as it plays, and the time bar drains
function tick() {
  if (!st) return;
  const t = nowSec();
  $('pturn').textContent = st.q > 0 ? `${st.q} more spin${st.q == 1 ? '' : 's'} waiting` : 'Waiting for tips';

  const left = st.at + st.sec - t;
  const running = st.sec > 0 && left > 0 && st.s !== 'paused';
  const rhythm = RHYTHMS[st.lv];
  const preset = !rhythm && isNaN(+st.lv);
  let level = running && !preset && !rhythm ? Math.min(+st.lv, st.mx) : 0;
  if (running && rhythm) {
    // where the toy is in its looping pattern right now, scaled like the controller does
    const step = Math.floor((Date.now() / 1000 - st.at) * 1000 / rhythm.ms) % rhythm.steps.length;
    level = Math.floor(rhythm.steps[Math.max(0, step)] * st.mx / 20);
  }
  else if (running && preset) level = Math.round(st.mx / 2 + Math.sin(presetAnim++ / 10) * st.mx / 2);
  bars.forEach((b, i) => b.classList.toggle('on', i < level));
  $('toynow').className = running ? '' : 'idle';
  $('toynow').textContent = !running ? (st.s === 'paused' ? 'Stopped' : 'Idle')
    : rhythm ? rhythm.label : preset ? PRESETS[st.lv] || st.lv : `Level ${level}`;
  $('timefill').style.width = running ? (left / st.sec * 100) + '%' : '0';
  $('timetxt').textContent = running ? `${left}s left` : '';
}
setInterval(tick, 100);

function apply() {
  const h = readHash();
  if (!h.s) return startDemo();
  clearInterval(demoTimer); demoTimer = null;
  st = { s: h.s, t: dec(h.t), pl: dec(h.pl), q: +h.q || 0, gr: +h.gr || 0, gg: +h.gg || 0, gt: dec(h.gt), mx: +h.mx || 20, r: (h.r || '').split(',').filter(x => x !== '').map(Number),
         o: h.o || '', l: dec(h.l), lv: dec(h.lv), sec: +h.sec || 0, at: +h.at || 0 };
  render();
}
addEventListener('hashchange', apply);

function startDemo() {
  if (demoTimer) return;
  const spins = [[[5, 5, 5], 'ZEUS! Thunderstorm for 30s', 'thunder', 30], [[3, 3, 3], "Aphrodite's heartbeat for 20s", 'heart', 20],
                 [[4, 4, 4], "Poseidon's rolling tide for 20s", 'tide', 20], [[2, 2, 2], "Dionysus' party beat for 15s", 'party', 15],
                 [[1, 1, 1], "Artemis' volley of arrows for 10s", 'arrows', 10], [[0, 0, 0], "Athena's climb for 12s", 'climb', 12],
                 [[0, 3, 0], 'A teasing gift from the gods (8s)', 'tease', 8]];
  let k = 0;
  const go = () => { const s = spins[k++ % spins.length];
    st = { s: 'live', t: '', pl: 'Velvet Rose', q: 3, gr: 620, gg: 1000, gt: 'Lap dance raffle!', mx: 20, r: s[0], o: '', l: s[1], lv: s[2], sec: s[3], at: nowSec() }; render(); };
  go(); demoTimer = setInterval(go, 9000);
}
apply();
</script>
</body>
</html>
