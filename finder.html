<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmonia</title>
<!-- Performer finder screen. Everything about the performers comes from performers.txt.
     The finder HUD script drives it through the address after "#":
     u=the HUD's web address (Close, Request Booking, Profile, Website and Notecard clicks are sent there),
     st=one digit per performer in file order (2 performing now, 1 in the club, 0 away),
     ack=<click number>.<result> (0 done, 1 too soon, 2 no avatar key for that performer).
     With no "#", it runs as a demo. Look comes from theme.css and club.js. -->
<!-- ?r=<stamp> goes on the shared files too, so each open gets their newest copies -->
<script>document.write(`<link rel="stylesheet" href="theme.css${location.search}">`);</script>
<style>
  button { font-family: var(--body-font); font-weight: 700; color: var(--ink); cursor: pointer; }
  .hud-btn:disabled, .cta:disabled { opacity: .4; box-shadow: none; }

  /* crest: the club's name between laurels, with the HUD's name on marble */
  #head { position: absolute; left: 0; right: 0; top: 11px; z-index: 3; text-align: center; pointer-events: none; }
  #head .crest { font-size: 32px; height: 38px; }
  #club { font-size: 32px; display: inline-block; line-height: 1.1; }
  #subtitle { display: inline-block; padding: 0 18px; font-style: italic; font-weight: 700; font-size: 16px; line-height: 21px; }

  .small { height: 32px; padding: 0 12px; font-size: 13px; letter-spacing: 1px; }
  #back { position: absolute; left: 34px; top: 24px; z-index: 3; }
  #found, #count { position: absolute; top: 25px; z-index: 3; height: 30px; align-items: center; font-size: 16px; color: var(--gold-light); }
  #found { left: 214px; }
  #count { left: 34px; }
  #close { position: absolute; right: 34px; top: 24px; z-index: 3; width: 32px; padding: 0; font-size: 18px; }
  #pager { position: absolute; right: 76px; top: 24px; z-index: 3; display: flex; align-items: center; gap: 7px; font-size: 16px; color: var(--gold-light); }
  #pager button { width: 32px; padding: 0; font-size: 18px; }

  section { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; }
  section.show { display: block; }

  /* first screen: the tagline, then a panel each for kinks, interests and vibes */
  #tagline { position: absolute; left: 34px; right: 34px; top: 73px; margin: 0; text-align: center; font-size: 19px; line-height: 22px; color: #ffc4f6; text-shadow: 0 0 4px var(--plum), 0 1px 8px var(--plum), 0 0 12px var(--neon-pink); }
  #groups { position: absolute; left: 34px; right: 34px; top: 100px; height: 340px; display: flex; gap: 10px; }
  .group { flex: 1; min-width: 170px; padding: 8px 8px; display: flex; flex-direction: column; --cut: 9px; }
  .group .heading { margin-bottom: 5px; }
  .picks { display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 3px; overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: #d9b57377 transparent; }
  .pick { height: 22px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--c); background: #ffffff0a; font-size: 15px; line-height: 18px; white-space: nowrap; transition: background .15s, box-shadow .15s; }
  .pick:hover { box-shadow: 0 0 10px var(--c); }
  .pick.on { border-color: var(--gold-light); background: linear-gradient(var(--gold-light), var(--gold)); color: var(--plum); box-shadow: 0 0 12px #d9b573aa; }
  #cta { position: absolute; left: 34px; right: 34px; top: 447px; height: 40px; display: flex; align-items: center; justify-content: center; gap: 14px; }

  /* results: cards on the left, the full photo in the middle, details on the right */
  #grid { position: absolute; left: 34px; top: 84px; width: 361px; height: 404px; display: grid; grid-template-rows: repeat(6, 64px); gap: 4px; }
  .card { position: relative; padding: 5px 7px 5px 5px; display: flex; gap: 8px; text-align: left; border-radius: 7px; border: 1px solid #d9b57366; background: linear-gradient(160deg, #240b4c, #17052f); box-shadow: 0 2px 8px #0008; overflow: hidden; transition: box-shadow .2s, border-color .2s; }
  .card:hover { border-color: var(--neon-cyan); }
  .card.on { border-color: #ff7be9; box-shadow: 0 0 12px #ff2ee6cc, inset 0 0 12px #ff2ee633; }
  .shot { flex: none; background: linear-gradient(var(--neon-violet), var(--plum)); overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: var(--title-font); font-weight: 700; color: #fff; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
  .thumb { width: 46px; height: 52px; border-radius: 4px; font-size: 24px; }
  .cinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .crow { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
  .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 20px; line-height: 24px; color: var(--marble); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; white-space: nowrap; color: var(--dim); }
  .stat i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; flex: none; }
  .stat.s2 { color: var(--neon-cyan); }
  .stat.s2 i { animation: blink 1.2s infinite; }
  .stat.s1 { color: var(--blush); }
  .stat.s0 i { box-shadow: none; opacity: .6; }
  @keyframes blink { 50% { opacity: .35; } }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .card .chips { flex: 1; min-width: 0; max-height: 22px; overflow: hidden; }
  .tag { height: 22px; line-height: 19px; padding: 0 7px; border-radius: 6px; border: 1px solid #b98aff99; background: #ffffff0a; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .tag.hit { border-color: var(--gold-light); background: linear-gradient(var(--gold-light), var(--gold)); color: var(--plum); }
  .pct { flex: none; font-weight: 700; font-size: 15px; font-style: italic; line-height: 22px; color: var(--gold-light); }

  .pane { position: absolute; left: 629px; top: 84px; width: 361px; height: 404px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .pane.lhs { left: 34px; }
  .pname { max-width: 100%; font-family: var(--title-font); font-weight: 700; font-size: 25px; letter-spacing: 1px; line-height: 32px; color: #fff; text-shadow: 0 0 10px var(--neon-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pane .stat { margin: 2px 0 8px; font-size: 16px; }
  #dabout { margin: 0 0 10px; font-size: 16px; line-height: 20px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  #dtags { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 5px; margin-top: 8px; overflow: hidden; }
  #actions { width: 100%; min-height: 40px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  #actions .msg { width: 100%; font-weight: 700; font-style: italic; font-size: 16px; line-height: 20px; color: var(--gold-light); text-align: center; }
  #actions .cta[data-do=more] { width: 100%; }

  #photo { position: absolute; left: 407px; top: 84px; width: 210px; height: 404px; --cut: 12px; }
  #bigshot { position: absolute; inset: 2px; font-size: 90px; clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 11px, 100% calc(100% - 11px), calc(100% - 11px) 100%, 11px 100%, 0 calc(100% - 11px), 0 11px); }
  #bigshot img { object-position: 50% 0; animation: fadein .35s; }
  @keyframes fadein { from { opacity: 0; } }
  .nav { position: absolute; top: 50%; width: 28px; height: 40px; margin-top: -20px; padding: 0; border: 1px solid #54b4ff; border-radius: 6px; background: #16063ad9; font-size: 20px; box-shadow: 0 0 8px #2f8cff99; }
  #prev { left: 6px; }
  #next { right: 6px; }
  #dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 7px; justify-content: center; }
  #dots i { width: 7px; height: 7px; border-radius: 50%; background: #ffffff66; }
  #dots i.on { background: #fff; box-shadow: 0 0 6px #fff; }

  /* Learn More covers the cards and details and leaves the big photo showing */
  #more { display: none; }
  #more.show { display: block; }
  #more .pane, #rates { z-index: 2; }
  #more .pane::after, #rates::after { background: linear-gradient(160deg, #240b4c, #17052f); }
  #mtext { flex: 1; min-height: 0; width: 100%; overflow-y: auto; font-size: 17px; line-height: 22px; color: var(--ink); scrollbar-width: thin; scrollbar-color: #d9b57377 transparent; }
  #mtext p { margin: 0 0 9px; }
  #mtags { flex: 1; min-height: 0; width: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #d9b57377 transparent; }
  .mrow { margin-bottom: 9px; }
  .mrow .heading { margin-bottom: 5px; font-size: 13px; }
  .mrow .chips { gap: 5px; justify-content: center; }
  #mbtns { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  #mbtns button, #rbtns button { min-width: 0; padding: 0 4px; font-size: 13px; letter-spacing: .3px; }

  /* the rate card covers everything below the crest, big photo included */
  #rates { position: absolute; left: 34px; top: 84px; width: 956px; height: 404px; padding: 10px 16px 12px; display: none; flex-direction: column; }
  #rates.show { display: flex; }
  #rname { text-align: center; font-family: var(--title-font); font-weight: 700; font-size: 21px; letter-spacing: 1px; line-height: 26px; color: #fff; text-shadow: 0 0 10px var(--neon-pink); white-space: nowrap; }
  #rintro { font-style: italic; font-size: 15px; line-height: 18px; text-align: center; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #rtabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-top: 6px; }
  #rtabs:empty { display: none; }
  .rtab { height: 25px; padding: 0 11px; border-radius: 6px; border: 1px solid #54b4ff; background: #16063ae6; font-size: 15px; line-height: 20px; }
  .rtab.on { border-color: var(--gold-light); background: linear-gradient(var(--gold-light), var(--gold)); color: var(--plum); }
  #rbody { flex: 1; min-height: 0; margin-top: 7px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #d9b57377 transparent; }
  #rcols { column-count: 3; column-gap: 10px; margin-bottom: -8px; }
  .rbox { break-inside: avoid; margin-bottom: 8px; padding: 5px 9px 6px; border: 1px solid #d9b57366; border-radius: 6px; background: #ffffff0a; }
  .rbox h4 { margin: 0 0 2px; font-family: var(--title-font); font-weight: 700; font-size: 14px; letter-spacing: .5px; line-height: 19px; color: var(--blush); text-align: center; }
  .rrow { display: flex; align-items: baseline; gap: 5px; font-size: 15px; line-height: 18px; }
  .rrow i { flex: 1; min-width: 8px; border-bottom: 1px dotted #ffffff44; }
  .rrow b { font-weight: 700; color: var(--gold-light); white-space: nowrap; }
  .rnote { margin: 1px 0 2px; font-style: italic; font-size: 15px; line-height: 17px; color: var(--dim); }
  #rmsg { padding-top: 60px; text-align: center; font-style: italic; font-size: 17px; color: var(--dim); }
  #rbtns { display: flex; gap: 10px; margin-top: 8px; }
  #rbtns button { flex: 1; }

  #err { position: absolute; left: 90px; right: 90px; top: 220px; z-index: 8; text-align: center; font-size: 18px; color: #ffb3c4; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="head">
    <div class="crest"><span id="ll"></span><div class="title" id="club"></div><span id="lr"></span></div>
    <div class="info marble" id="subtitle"></div>
  </div>
  <button class="hud-btn small" id="back">‹ Change My Picks</button>
  <div class="plaque" id="found"></div>
  <div class="plaque" id="count"></div>
  <div id="pager"><button class="hud-btn small" id="pgup" aria-label="Previous page">‹</button><span id="pgtxt"></span><button class="hud-btn small" id="pgdn" aria-label="Next page">›</button></div>
  <button class="hud-btn small" id="close" aria-label="Close">×</button>

  <section id="ask">
    <h2 class="subtitle" id="tagline"></h2>
    <div id="groups"></div>
    <div id="cta"><button class="cta" id="go">Find My Match</button><button class="hud-btn" id="all">Browse Everyone</button></div>
  </section>

  <section id="list">
    <div id="grid"></div>
    <div class="temple pane" id="detail">
      <div class="pname" id="dname"></div><div class="stat" id="dstat"></div><p id="dabout"></p>
      <h3 class="heading">Specialties / Kinks</h3><div id="dtags"></div><div id="actions"></div>
    </div>
    <div class="temple" id="photo">
      <div class="shot" id="bigshot"></div>
      <button class="nav" id="prev" aria-label="Previous photo">‹</button><button class="nav" id="next" aria-label="Next photo">›</button>
      <div id="dots"></div>
    </div>
    <div id="more">
      <div class="temple pane lhs"><div class="pname" id="mname"></div><div class="stat" id="mstat"></div><div id="mtext"></div></div>
      <div class="temple pane">
        <div id="mtags"></div>
        <div id="mbtns"><button class="hud-btn" id="mback">‹ Back</button><button class="hud-btn" id="mprofile">Profile Link In Chat</button><button class="hud-btn" id="mrates">View Rates ›</button><button class="cta" id="mbook">Request Booking</button></div>
      </div>
    </div>
    <div class="temple" id="rates">
      <div id="rname"></div><div id="rintro"></div>
      <div id="rtabs"></div>
      <div id="rbody"></div>
      <div id="rbtns"><button class="hud-btn" id="rback">‹ Back</button><button class="hud-btn" id="rsite">Website Link In Chat</button><button class="hud-btn" id="rnote">Send Me The Notecard</button><button class="cta" id="rbook">Request Booking</button></div>
    </div>
  </section>
  <div id="err"></div>
</div>
<script>document.write(`<script src="club.js${location.search}"><\/script>`);</script>
<script>
const STATUS = ['Away', 'In the Club', 'Performing Now'];
const GROUPS = [['kinks', 'Kinks', 'var(--neon-pink)'], ['interests', 'Interests', '#b98aff'], ['vibes', 'Vibes', 'var(--neon-cyan)']];
const PER_PAGE = 6;
const DEMO_STATUS = [2, 1, 1, 0, 1, 0];

const stage = $('stage');
let people = [], choices = {}, picks = new Set(), found = [], page = 0, sel = null, shot = 0;
let hud = '', demo = true, clicks = 0, waiting = null, bookTimer = 0, rateCard = null, club = 'club';

fit(stage);
scenery(stage);
$('ll').innerHTML = LAUREL(false);
$('lr').innerHTML = LAUREL(true);

const list = v => (v || '').split(',').map(w => w.trim()).filter(Boolean);

// performers.txt: settings and the button lists first, then one block per performer, each starting with NAME
function readRoster(text) {
  const info = {};
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim(), c = line.indexOf(':');
    if (!line || line[0] === '#' || c < 0) return;
    const k = line.slice(0, c).trim().toUpperCase(), v = line.slice(c + 1).trim();
    const p = people[people.length - 1];
    if (k === 'NAME') people.push({ i: people.length, name: v, status: 0, photo: '', full: [], kinks: [], interests: [], vibes: [], about: '', more: '', tags: [] });
    else if (!p) info[k] = v;
    else if (k === 'KEY') p.key = v;
    else if (k === 'PHOTO') p.photo = v;
    else if (k === 'FULL') p.full = list(v);
    else if (k === 'KINKS' || k === 'INTERESTS' || k === 'VIBES') p[k.toLowerCase()] = list(v);
    else if (k === 'ABOUT') p.about = v;
    else if (k === 'MORE') p.more = v;
    else if (k === 'RATES') p.rates = v;
    else if (k === 'WEBSITE') p.site = v;
    else if (k === 'NOTECARD') p.card = v;
  });
  people.forEach(p => { p.tags = [...p.kinks, ...p.interests, ...p.vibes]; if (!p.full.length && p.photo) p.full = [p.photo]; });
  GROUPS.forEach(([key]) => choices[key] = list(info[key.toUpperCase()]));
  club = info.CLUB || 'club';
  fitText($('club'), info.TITLE || CLUB_DEFAULT, 340, 32);
  document.title = info.TITLE || CLUB_DEFAULT;
  $('subtitle').textContent = info.SUBTITLE || '';
  $('tagline').textContent = info.TAGLINE || '';
}

const picture = (src, name) => src ? `<img src="${esc(src)}" alt="" onerror="this.parentNode.textContent='${esc(name[0] || '')}'">` : esc(name[0] || '');
const statusRow = p => `<i></i>${STATUS[p.status]}`;

function show(id) {
  ['ask', 'list'].forEach(s => $(s).classList.toggle('show', s === id));
  $('back').style.display = $('found').style.display = id === 'list' ? '' : 'none';
  $('count').style.display = id === 'ask' ? '' : 'none';
  if (id === 'ask') $('pager').style.display = 'none';
}

function drawAsk() {
  $('groups').innerHTML = GROUPS.map(([key, label, color]) => {
    // most common words first, then the rest A to Z, and longer lists get wider panels
    const n = {};
    choices[key].forEach(w => n[w] = 0);
    people.forEach(p => p[key].forEach(w => n[w] = (n[w] || 0) + 1));
    const words = Object.keys(n).sort((a, b) => n[b] - n[a] || a.localeCompare(b));
    return `<div class="temple group" style="--c:${color};flex-grow:${words.join('').length + 3 * words.length}"><h3 class="heading">${label}</h3><div class="picks">`
      + words.map(w => `<button class="pick${picks.has(w) ? ' on' : ''}" data-w="${esc(w)}">${esc(w)}</button>`).join('') + `</div></div>`;
  }).join('');
  drawCount();
}

function drawCount() {
  const n = search().length, live = people.filter(p => p.status === 2).length;
  $('count').textContent = (picks.size ? `${n} match${n === 1 ? '' : 'es'}` : `${people.length} performers`) + (live ? ` · ${live} on stage now` : '');
  const ready = picks.size && n;
  $('go').disabled = !ready;
  $('go').style.opacity = ready ? 1 : .45;
}

// Best match first, and among equals whoever is around right now
function search() {
  const want = [...picks];
  return people.map(p => ({ p, hits: want.filter(w => p.tags.includes(w)) }))
    .filter(r => !want.length || r.hits.length)
    .sort((a, b) => b.hits.length - a.hits.length || b.p.status - a.p.status || a.p.i - b.p.i);
}

function openList() {
  found = search();
  page = 0;
  show('list');
  $('found').textContent = `${found.length} found`;
  choose(found[0] && found[0].p);
  drawCards();
}

function drawCards() {
  const pages = Math.max(1, Math.ceil(found.length / PER_PAGE));
  $('pager').style.display = pages > 1 ? 'flex' : 'none';
  $('pgtxt').textContent = `${page + 1} / ${pages}`;
  $('pgup').disabled = page === 0;
  $('pgdn').disabled = page >= pages - 1;
  $('grid').innerHTML = found.slice(page * PER_PAGE, (page + 1) * PER_PAGE).map(({ p, hits }) => {
    // show what matched first
    const tags = [...hits, ...p.tags.filter(t => !hits.includes(t))].slice(0, 4);
    const perfect = picks.size && hits.length === picks.size;
    return `<button class="card${p === sel ? ' on' : ''}" data-i="${p.i}">
      <div class="shot thumb">${picture(p.photo, p.name)}</div>
      <div class="cinfo"><div class="crow"><div class="nm">${esc(p.name)}</div><div class="stat s${p.status}">${statusRow(p)}</div></div>
      <div class="crow"><div class="chips">${tags.map(t => `<span class="tag${hits.includes(t) ? ' hit' : ''}">${esc(t)}</span>`).join('')}</div>
      ${picks.size ? `<span class="pct">${perfect ? 'Perfect' : `${hits.length} of ${picks.size}`}</span>` : ''}</div></div></button>`;
  }).join('');
}

function choose(p) {
  sel = p;
  shot = 0;
  closeMore();
  bookState('idle');
  drawDetail();
  drawPhoto();
  drawCards();
}

function drawDetail() {
  if (!sel) return;
  $('dname').textContent = sel.name;
  $('dstat').className = $('mstat').className = `stat s${sel.status}`;
  $('dstat').innerHTML = $('mstat').innerHTML = statusRow(sel);
  $('dabout').textContent = sel.about;
  $('dtags').innerHTML = sel.tags.slice(0, 8).map(t => `<span class="tag${picks.has(t) ? ' hit' : ''}">${esc(t)}</span>`).join('');
}

function drawPhoto() {
  if (!sel) return;
  const n = sel.full.length;
  $('bigshot').innerHTML = picture(sel.full[shot], sel.name);
  $('prev').style.display = $('next').style.display = n > 1 ? '' : 'none';
  $('dots').innerHTML = n > 1 ? sel.full.map((f, i) => `<i class="${i === shot ? 'on' : ''}"></i>`).join('') : '';
}

function openMore() {
  $('mname').textContent = sel.name;
  const row = (label, tags) => tags.length ? `<div class="mrow"><h3 class="heading">${label}</h3><div class="chips">${tags.map(t => `<span class="tag${picks.has(t) ? ' hit' : ''}">${esc(t)}</span>`).join('')}</div></div>` : '';
  $('mtext').innerHTML = `<p>${esc(sel.about)}</p>${sel.more ? `<p>${esc(sel.more)}</p>` : ''}`;
  $('mtags').innerHTML = row('Kinks', sel.kinks) + row('Interests', sel.interests) + row('Vibes', sel.vibes);
  $('mrates').style.display = sel.rates || sel.site || sel.card ? '' : 'none';
  $('more').classList.add('show');
}
function closeRates() { $('rates').classList.remove('show'); }
function closeMore() { $('more').classList.remove('show'); closeRates(); }

// A performer's rate card file: INTRO, then TAB and CARD headings. "label = price" makes a price row, any other line a note
function readRates(text) {
  const card = { intro: '', tabs: [] };
  let tab = null, box = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim(), head = line.match(/^(INTRO|TAB|CARD):\s*(.*)$/i);
    if (!line || line[0] === '#') return;
    const kind = head ? head[1].toUpperCase() : '';
    if (kind === 'INTRO') { card.intro = head[2]; return; }
    if (kind === 'TAB') { tab = { name: head[2], boxes: [] }; box = null; card.tabs.push(tab); return; }
    if (!tab) { tab = { name: 'Rates', boxes: [] }; card.tabs.push(tab); }
    if (kind === 'CARD' || !box) { box = { title: kind === 'CARD' ? head[2] : '', rows: [] }; tab.boxes.push(box); }
    if (kind === 'CARD') return;
    const eq = line.indexOf('=');
    box.rows.push(eq < 0 ? { note: line } : { label: line.slice(0, eq).trim(), price: line.slice(eq + 1).trim() });
  });
  return card;
}

function drawRates(card, on) {
  $('rintro').textContent = card.intro;
  $('rtabs').innerHTML = card.tabs.length > 1 ? card.tabs.map((t, i) => `<button class="rtab${i === on ? ' on' : ''}" data-t="${i}">${esc(t.name)}</button>`).join('') : '';
  const tab = card.tabs[on];
  $('rbody').scrollTop = 0;
  $('rbody').innerHTML = tab ? `<div id="rcols">${tab.boxes.map(b => `<div class="rbox">${b.title ? `<h4>${esc(b.title)}</h4>` : ''}${b.rows.map(r => r.note
    ? `<div class="rnote">${esc(r.note)}</div>`
    : `<div class="rrow"><span>${esc(r.label)}</span><i></i><b>${esc(r.price)}</b></div>`).join('')}</div>`).join('')}</div>` : '';
}

function openRates() {
  const who = sel, msg = text => { $('rintro').textContent = ''; $('rtabs').innerHTML = ''; $('rbody').innerHTML = `<div id="rmsg">${esc(text)}</div>`; };
  $('rname').textContent = `${who.name}'s Rates`;
  $('rsite').style.display = who.site ? '' : 'none';
  $('rnote').style.display = who.card ? '' : 'none';
  $('rates').classList.add('show');
  if (!who.rates) return msg('Use the buttons below to find out more.');
  msg('Loading…');
  fetch(`${who.rates}?v=${Date.now()}`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => { if (sel === who) { rateCard = readRates(text); drawRates(rateCard, 0); } })
    .catch(() => { if (sel === who) msg("This rate card couldn't be loaded. Please try again in a moment."); });
}

// The screen tells the HUD script by loading its web address; the script answers in the "#" (ack)
function tellHud(action, i, value) {
  const id = ++clicks;
  if (demo) setTimeout(() => answered(id, 0), 800);
  else if (hud) new Image().src = `${hud}?a=${action}&i=${i}&s=${id}` + (value ? `&v=${encodeURIComponent(value)}` : '');
  return id;
}

// The HUD script can't hold performers.txt, so it's told who's who, one at a time and in order
function tellRoster() {
  let i = 0;
  const next = () => {
    if (!hud) return;
    if (i >= people.length) { new Image().src = `${hud}?a=ready`; return; }
    const p = people[i++], img = new Image();
    img.onload = img.onerror = next;
    img.src = `${hud}?a=who&i=${p.i}&k=${p.key || 'none'}&n=${encodeURIComponent(p.name)}&c=${encodeURIComponent(club)}`;
  };
  next();
}

function bookState(state) {
  const a = $('actions'), name = sel ? esc(sel.name.split(' ')[0]) : '';
  clearTimeout(bookTimer);
  a.className = state === 'confirm' ? 'ask' : '';
  const say = text => `<div class="msg">${text}</div>`;
  a.innerHTML = {
    idle: `<button class="cta" data-do="more">Learn More ›</button>`,
    confirm: `${say(`Send ${name} your name and a booking request?`)}<button class="cta" data-do="send">Send</button><button class="hud-btn" data-do="idle">Cancel</button>`,
    sending: say('Sending your request…'),
    sent: say(`Request sent! Watch for a message from ${name}.`),
    wait: say('Please wait a minute before sending another request.'),
    nokey: say(`${name} can't take requests through the HUD yet.`),
    fail: say("Couldn't reach your HUD. Please try again in a moment.")
  }[state];
  if (state !== 'idle' && state !== 'confirm' && state !== 'sending') bookTimer = setTimeout(() => bookState('idle'), 7000);
}

function answered(id, code) {
  if (id !== waiting) return;
  waiting = null;
  bookState(['sent', 'wait', 'nokey'][code] || 'fail');
}

function sendBooking() {
  bookState('sending');
  closeMore();
  const id = waiting = tellHud('book', sel.i);
  setTimeout(() => { if (waiting === id) { waiting = null; bookState('fail'); } }, 9000);
}

$('groups').addEventListener('click', e => {
  const b = e.target.closest('.pick');
  if (!b) return;
  const w = b.dataset.w;
  picks.has(w) ? picks.delete(w) : picks.add(w);
  b.classList.toggle('on', picks.has(w));
  drawCount();
});
$('go').addEventListener('click', () => { if (picks.size) openList(); });
$('all').addEventListener('click', () => { picks.clear(); drawAsk(); openList(); });
$('back').addEventListener('click', () => { closeMore(); drawAsk(); show('ask'); });
$('close').addEventListener('click', () => { if (!demo) tellHud('close', 0); });
$('grid').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) choose(people[+c.dataset.i]);
});
$('pgup').addEventListener('click', () => { page--; drawCards(); });
$('pgdn').addEventListener('click', () => { page++; drawCards(); });
$('prev').addEventListener('click', () => { shot = (shot + sel.full.length - 1) % sel.full.length; drawPhoto(); });
$('next').addEventListener('click', () => { shot = (shot + 1) % sel.full.length; drawPhoto(); });
$('actions').addEventListener('click', e => {
  const d = e.target.dataset.do;
  if (d === 'more') openMore();
  else if (d === 'send') sendBooking();
  else if (d === 'idle') bookState('idle');
});
$('mback').addEventListener('click', closeMore);
$('mbook').addEventListener('click', () => { closeMore(); bookState('confirm'); });
$('mrates').addEventListener('click', openRates);
$('rback').addEventListener('click', closeRates);
$('rbook').addEventListener('click', () => { closeMore(); bookState('confirm'); });
$('rtabs').addEventListener('click', e => {
  const t = e.target.closest('.rtab');
  if (t) drawRates(rateCard, +t.dataset.t);
});
// These answer in the patron's chat, so the button only says where to look
function chatButton(id, action, value) {
  const b = $(id), label = b.textContent;
  b.addEventListener('click', () => { tellHud(action, sel.i, value && value()); b.textContent = 'Check Your Chat ✓'; setTimeout(() => b.textContent = label, 3000); });
}
chatButton('mprofile', 'profile');
chatButton('rsite', 'site', () => sel.site);
chatButton('rnote', 'note', () => sel.card);

// Live status and answers from the HUD script
function apply() {
  const h = readHash();
  demo = !h.u;
  if (h.u) hud = dec(h.u);
  people.forEach((p, i) => p.status = demo ? (DEMO_STATUS[i] || 0) : +(h.st || '')[i] || 0);
  if ($('ask').classList.contains('show')) drawCount();
  else { drawDetail(); drawCards(); }
  if (h.ack) { const [id, code] = h.ack.split('.'); answered(+id, +code); }
}
addEventListener('hashchange', apply);

show('ask');
fetch('performers.txt?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(text => {
    readRoster(text);
    if (!people.length) throw new Error('empty');
    apply();
    drawAsk();
    if (!demo) tellRoster();
  })
  .catch(e => { $('err').textContent = `Couldn't load the performer list (${e.message}).`; });
</script>
</body>
</html>
